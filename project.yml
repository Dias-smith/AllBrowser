name: AllBrowser
options:
  bundleIdPrefix: com.allbrowser
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  AllBrowserKits:
    path: Packages/AllBrowserKits

targets:
  AllBrowser:
    type: application
    platform: iOS
    sources:
      - path: Apps/AllBrowser/Sources
    resources:
      - path: Apps/AllBrowser/Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allbrowser.app
        INFOPLIST_FILE: Apps/AllBrowser/Resources/Info.plist
        PRODUCT_NAME: AllBrowser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SUPPORTS_XR_DESIGNED_FOR_IPAD: false
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - package: AllBrowserKits
        product: DesignSystem
      - package: AllBrowserKits
        product: StorageKit
      - package: AllBrowserKits
        product: AppLockKit
      - package: AllBrowserKits
        product: AdBlockKit
      - package: AllBrowserKits
        product: BrowserKit
      - package: AllBrowserKits
        product: MediaKit
      - package: AllBrowserKits
        product: PlaylistKit
      - package: AllBrowserKits
        product: DownloadsKit
      - package: AllBrowserKits
        product: PhotosKit
      - package: AllBrowserKits
        product: CachePhotosKit
      - package: AllBrowserKits
        product: YouTubeKit
      - target: ContentBlocker
        embed: true
        codeSign: true

  ContentBlocker:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/AllBrowser/ContentBlocker
        excludes:
          - Info.plist
          - blockerList.json
    resources:
      - path: Apps/AllBrowser/ContentBlocker/blockerList.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allbrowser.app.ContentBlocker
        INFOPLIST_FILE: Apps/AllBrowser/ContentBlocker/Info.plist
        PRODUCT_NAME: ContentBlocker
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        SKIP_INSTALL: YES

schemes:
  AllBrowser:
    build:
      targets:
        AllBrowser: all
        ContentBlocker: all
    run:
      config: Debug
      askForAppToLaunch: false
